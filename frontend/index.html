<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0f1e">
    <title>Lumen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="signage" aria-live="polite">
      <!-- Zuke × business brand bar (filled by app.js with the active ad's business) -->
      <div id="brandBar" class="brand-bar"></div>

      <section id="media-stage" class="stage" aria-label="Retail promotion">
        <img id="image-media" class="media hidden" alt="">
        <video id="video-media" class="media hidden" muted playsinline></video>
        <div id="empty-state" class="empty-state hidden">
          <p class="eyebrow">LUMEN</p>
          <h1>Fresh offers are on their way.</h1>
          <p>Please check back shortly.</p>
        </div>
        <div id="caption" class="caption hidden">
          <p id="caption-business" class="caption-business"></p>
          <p id="caption-name" class="caption-name"></p>
        </div>
        <aside id="payment-overlay" class="payment-overlay hidden" aria-label="Payment QR code">
          <div id="qr-code" class="qr-code"></div><p>Scan to pay</p>
        </div>
      </section>
      <section id="youtube-stage" class="stage hidden" aria-label="Entertainment">
        <div id="youtube-player"></div>
        <div class="entertainment-label">NOW PLAYING · YOUTUBE</div>
      </section>

      <div class="progress"><span id="progress-bar"></span></div>
      <button id="master-mute" class="master-mute" aria-label="Toggle mute">
        <svg id="mute-icon-on" class="hidden" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 7 9H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71v-4.17l4.18 4.18c-.49.37-1.02.68-1.6.91-.36.15-.58.53-.58.92 0 .72.73 1.18 1.39.91.8-.33 1.55-.77 2.22-1.31l1.34 1.34a.996.996 0 101.41-1.41L5.05 3.63c-.39-.39-1.02-.39-1.42 0zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87 0-4.28-2.99-7.86-7-8.77-.37-.08-.7-.02-1 .28-.3.3-.4.73-.25 1.09.2.48.31.99.31 1.53 0 .39-.06.77-.17 1.13l2.84 2.84c.8-.1 1.27.9.71 1.47l-.14.14C18.15 11.23 19 12 19 12zM12 4v.17c0 .89-1.08 1.34-1.71.71L10 4.59v.58l2 2V4z"/></svg>
        <svg id="mute-icon-off" viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3 9v6c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71V4.41c0-.89-1.08-1.34-1.71-.71L7 7H4c-.55 0-1 .45-1 1zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </button>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="kiosk-guard.js"></script>
    <script src="subscription-adapter.js"></script>
    <script src="app.js"></script>
  </body>
</html>
